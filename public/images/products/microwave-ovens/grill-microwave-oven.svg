<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <!-- Body: dark metallic -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3a3a3e"/>
      <stop offset="40%"  stop-color="#2a2a2e"/>
      <stop offset="80%"  stop-color="#222226"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <!-- Stainless steel front -->
    <linearGradient id="steelFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#999"/>
      <stop offset="25%"  stop-color="#bbb"/>
      <stop offset="50%"  stop-color="#888"/>
      <stop offset="80%"  stop-color="#777"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <!-- Door glass -->
    <linearGradient id="doorGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(20,20,25,0.75)"/>
      <stop offset="30%"  stop-color="rgba(15,15,20,0.8)"/>
      <stop offset="70%"  stop-color="rgba(10,10,15,0.85)"/>
      <stop offset="100%" stop-color="rgba(25,25,30,0.8)"/>
    </linearGradient>
    <!-- Interior -->
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <!-- Grill element glow -->
    <radialGradient id="grillGlow" cx="0.5" cy="0.8" r="0.6">
      <stop offset="0%"   stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="rgba(255,100,0,0)"/>
    </radialGradient>
    <!-- Turntable glass -->
    <radialGradient id="turntableGlass" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="80%"  stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </radialGradient>
    <!-- Control panel -->
    <linearGradient id="controlPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <!-- Chrome -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ccc"/>
      <stop offset="30%"  stop-color="#eee"/>
      <stop offset="50%"  stop-color="#aaa"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <!-- Sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
      <stop offset="40%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="48%"  stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="52%"  stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="60%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="drop" x="-6%" y="-4%" width="112%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-8%" y="-4%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="320" cy="448" rx="200" ry="14" fill="rgba(0,0,0,0.08)"/>

  <!-- Feet -->
  <rect x="155" y="418" width="16" height="7" rx="2.5" fill="#444"/>
  <rect x="469" y="418" width="16" height="7" rx="2.5" fill="#444"/>

  <!-- Main body -->
  <rect x="140" y="105" width="360" height="318" rx="16" fill="url(#bodyGrad)" filter="url(#drop)"/>

  <!-- Chrome handle bar -->
  <rect x="152" y="120" width="8" height="60" rx="3" fill="url(#chrome)"/>
  <rect x="152" y="120" width="8" height="60" rx="3" fill="url(#chrome)"/>

  <!-- Stainless steel front panel -->
  <rect x="165" y="118" width="180" height="290" rx="8" fill="url(#steelFront)"/>

  <!-- Door window area -->
  <rect x="178" y="132" width="154" height="180" rx="6" fill="#111"/>

  <!-- Interior visible through glass -->
  <rect x="182" y="136" width="146" height="130" rx="3" fill="url(#interior)"/>

  <!-- Grill element (top of interior) -->
  <g>
    <!-- Glow behind element -->
    <rect x="186" y="138" width="138" height="18" rx="3" fill="url(#grillGlow)" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Grill coils -->
    <path d="M190 146 L200 146 L200 150 L210 150 L210 146 L220 146 L220 150 L230 150 L230 146 L240 146 L240 150 L250 150 L250 146 L260 146 L260 150 L270 150 L270 146 L280 146 L280 150 L290 150 L290 146 L300 146 L300 150 L310 150 L310 146 L320 146" fill="none" stroke="#e85d04" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke" values="#e85d04;#ff7b25;#e85d04" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <!-- Element glow overlay -->
    <rect x="186" y="142" width="138" height="8" rx="2" fill="#ff6a00" opacity="0.15">
      <animate attributeName="opacity" values="0.08;0.22;0.08" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Door glass overlay -->
  <rect x="182" y="136" width="146" height="172" rx="3" fill="url(#doorGlass)"/>
  <!-- Glass reflection -->
  <rect x="188" y="142" width="40" height="155" rx="3" fill="rgba(255,255,255,0.04)"/>

  <!-- Turntable -->
  <g>
    <!-- Turntable glass disc -->
    <ellipse cx="255" cy="280" rx="48" ry="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 255 280" to="360 255 280" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Food dish on turntable -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 255 280" to="360 255 280" dur="8s" repeatCount="indefinite"/>
      <!-- Plate -->
      <ellipse cx="255" cy="278" rx="30" ry="5" fill="#ddd" opacity="0.5"/>
      <!-- Food item -->
      <ellipse cx="255" cy="275" rx="18" ry="8" fill="#c4952e" opacity="0.5"/>
      <ellipse cx="250" cy="273" rx="4" ry="2.5" fill="#8b6914" opacity="0.4"/>
      <ellipse cx="260" cy="273" rx="3.5" ry="2" fill="#8b6914" opacity="0.4"/>
    </g>
  </g>

  <!-- Digital display -->
  <rect x="360" y="135" width="120" height="36" rx="5" fill="#0a0a0a"/>
  <rect x="364" y="139" width="112" height="28" rx="3" fill="#1a2a1a"/>

  <!-- Display text -->
  <text x="420" y="159" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#4dff4d" opacity="0.9">
    03:30
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Display labels -->
  <text x="368" y="155" font-family="system-ui, sans-serif" font-size="7" fill="#2d7a2d">GRILL</text>
  <text x="452" y="155" text-anchor="end" font-family="system-ui, sans-serif" font-size="7" fill="#2d7a2d">900W</text>

  <!-- Control panel grid -->
  <rect x="360" y="182" width="120" height="220" rx="5" fill="url(#controlPanel)"/>

  <!-- Grill button -->
  <rect x="372" y="195" width="96" height="26" rx="4" fill="#e85d04" filter="url(#soft)"/>
  <text x="420" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#fff">GRILL</text>

  <!-- Microwave button -->
  <rect x="372" y="228" width="46" height="22" rx="4" fill="#333"/>
  <text x="395" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#aaa">MW</text>

  <!-- Combi button -->
  <rect x="422" y="228" width="46" height="22" rx="4" fill="#333"/>
  <text x="445" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#aaa">COMBI</text>

  <!-- Defrost button -->
  <rect x="372" y="256" width="96" height="22" rx="4" fill="#333"/>
  <text x="420" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#aaa">DEFROST</text>

  <!-- Numeric keypad -->
  <rect x="372" y="286" width="30" height="18" rx="3" fill="#444"/>
  <rect x="405" y="286" width="30" height="18" rx="3" fill="#444"/>
  <rect x="438" y="286" width="30" height="18" rx="3" fill="#444"/>
  <rect x="372" y="308" width="30" height="18" rx="3" fill="#444"/>
  <rect x="405" y="308" width="30" height="18" rx="3" fill="#444"/>
  <rect x="438" y="308" width="30" height="18" rx="3" fill="#444"/>
  <rect x="372" y="330" width="30" height="18" rx="3" fill="#444"/>
  <rect x="405" y="330" width="30" height="18" rx="3" fill="#444"/>
  <rect x="438" y="330" width="30" height="18" rx="3" fill="#444"/>
  <!-- 0 button -->
  <rect x="405" y="354" width="30" height="18" rx="3" fill="#444"/>

  <!-- Start / Stop buttons -->
  <rect x="372" y="354" width="30" height="18" rx="3" fill="#2a5a3a"/>
  <text x="387" y="367" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#7ec88a">▶</text>
  <rect x="438" y="354" width="30" height="18" rx="3" fill="#5a2a2a"/>
  <text x="453" y="367" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#e88">■</text>

  <!-- Door handle -->
  <rect x="340" y="160" width="18" height="60" rx="4" fill="url(#chrome)" filter="url(#soft)"/>

  <!-- Body sheen -->
  <rect x="150" y="110" width="340" height="305" rx="12" fill="url(#sheen)" pointer-events="none"/>

  <!-- Bottom chrome trim -->
  <rect x="150" y="398" width="340" height="3" rx="1.5" fill="url(#chrome)" opacity="0.4"/>

  <!-- Power LED -->
  <circle cx="370" cy="392" r="3.5" fill="#3cb878">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="392" r="7" fill="#3cb878" opacity="0.08">
    <animate attributeName="opacity" values="0.02;0.14;0.02" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Brand -->
  <text x="255" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#888">GRILL OVEN</text>
</svg>
