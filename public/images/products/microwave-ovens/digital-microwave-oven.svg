<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a3e"/><stop offset="40%" stop-color="#2a2a2e"/><stop offset="80%" stop-color="#222226"/><stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <linearGradient id="steelFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#999"/><stop offset="25%" stop-color="#bbb"/><stop offset="50%" stop-color="#888"/><stop offset="80%" stop-color="#777"/><stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="doorGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(15,15,20,0.7)"/><stop offset="50%" stop-color="rgba(10,10,15,0.82)"/><stop offset="100%" stop-color="rgba(20,20,25,0.75)"/>
    </linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/><stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/><stop offset="30%" stop-color="#eee"/><stop offset="50%" stop-color="#aaa"/><stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/><stop offset="40%" stop-color="rgba(255,255,255,0)"/><stop offset="48%" stop-color="rgba(255,255,255,0.1)"/><stop offset="52%" stop-color="rgba(255,255,255,0.1)"/><stop offset="60%" stop-color="rgba(255,255,255,0)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="drop" x="-6%" y="-2%" width="112%" height="114%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="soft" x="-8%" y="-4%" width="116%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>

  <ellipse cx="320" cy="448" rx="195" ry="14" fill="rgba(0,0,0,0.07)"/>
  <rect x="155" y="418" width="16" height="7" rx="3" fill="#444"/>
  <rect x="469" y="418" width="16" height="7" rx="3" fill="#444"/>

  <rect x="140" y="110" width="360" height="313" rx="16" fill="url(#bodyGrad)" filter="url(#drop)"/>
  <rect x="150" y="395" width="340" height="3" rx="1.5" fill="url(#chrome)" opacity="0.4"/>

  <!-- Steel front -->
  <rect x="158" y="125" width="170" height="265" rx="6" fill="url(#steelFront)"/>

  <!-- Door window -->
  <rect x="170" y="138" width="146" height="170" rx="5" fill="#111"/>
  <rect x="175" y="143" width="136" height="125" rx="3" fill="url(#interior)"/>

  <!-- Turntable -->
  <ellipse cx="243" cy="250" rx="40" ry="6.5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 243 250" to="360 243 250" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <g><animateTransform attributeName="transform" type="rotate" from="0 243 250" to="360 243 250" dur="10s" repeatCount="indefinite"/>
  <ellipse cx="243" cy="247" rx="24" ry="4" fill="#ddd" opacity="0.4"/></g>

  <!-- Door glass -->
  <rect x="175" y="143" width="136" height="162" rx="3" fill="url(#doorGlass)"/>
  <rect x="182" y="150" width="30" height="140" rx="2" fill="rgba(255,255,255,0.035)"/>

  <!-- Door handle -->
  <rect x="322" y="195" width="8" height="65" rx="3" fill="url(#chrome)"/>

  <!-- Control panel -->
  <rect x="340" y="128" width="140" height="258" rx="6" fill="#1a1a1e"/>

  <!-- Digital display -->
  <rect x="352" y="140" width="116" height="34" rx="4" fill="#0a0a0a"/>
  <rect x="356" y="143" width="108" height="28" rx="3" fill="#1a2a1a"/>
  <text x="410" y="163" text-anchor="middle" font-family="monospace" font-size="19" font-weight="bold" fill="#4dff4d" opacity="0.9">05:30<animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/></text>
  <text x="360" y="157" font-family="system-ui, sans-serif" font-size="7" fill="#2d7a2d">MW</text>
  <text x="448" y="157" text-anchor="end" font-family="system-ui, sans-serif" font-size="7" fill="#2d7a2d">800W</text>

  <!-- Quick buttons -->
  <rect x="352" y="182" width="56" height="22" rx="4" fill="#333"/>
  <text x="380" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#aaa">EXPRESS</text>
  <rect x="412" y="182" width="56" height="22" rx="4" fill="#333"/>
  <text x="440" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#aaa">+30s</text>

  <rect x="352" y="210" width="36" height="20" rx="3" fill="#333"/>
  <text x="370" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#aaa">DEF</text>
  <rect x="392" y="210" width="36" height="20" rx="3" fill="#333"/>
  <text x="410" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#aaa">BEV</text>
  <rect x="432" y="210" width="36" height="20" rx="3" fill="#333"/>
  <text x="450" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#aaa">VEG</text>

  <rect x="352" y="236" width="36" height="20" rx="3" fill="#333"/>
  <text x="370" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#aaa">MEAT</text>
  <rect x="392" y="236" width="36" height="20" rx="3" fill="#333"/>
  <text x="410" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#aaa">RICE</text>
  <rect x="432" y="236" width="36" height="20" rx="3" fill="#333"/>
  <text x="450" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#aaa">FISH</text>

  <!-- Number pad -->
  <rect x="352" y="264" width="28" height="18" rx="3" fill="#444"/>
  <rect x="384" y="264" width="28" height="18" rx="3" fill="#444"/>
  <rect x="416" y="264" width="28" height="18" rx="3" fill="#444"/>
  <rect x="352" y="286" width="28" height="18" rx="3" fill="#444"/>
  <rect x="384" y="286" width="28" height="18" rx="3" fill="#444"/>
  <rect x="416" y="286" width="28" height="18" rx="3" fill="#444"/>
  <rect x="352" y="308" width="28" height="18" rx="3" fill="#444"/>
  <rect x="384" y="308" width="28" height="18" rx="3" fill="#444"/>
  <rect x="416" y="308" width="28" height="18" rx="3" fill="#444"/>
  <rect x="384" y="332" width="28" height="18" rx="3" fill="#444"/>

  <!-- Start / Stop -->
  <rect x="352" y="332" width="28" height="18" rx="3" fill="#2a5a3a"/>
  <text x="366" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7ec88a">▶</text>
  <rect x="416" y="332" width="28" height="18" rx="3" fill="#5a2a2a"/>
  <text x="430" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e88">■</text>

  <!-- LED -->
  <circle cx="448" cy="355" r="3.5" fill="#3cb878"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>

  <text x="255" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#777">DIGITAL</text>
</svg>