<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <!-- Stainless steel body -->
    <linearGradient id="steelBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#888"/>
      <stop offset="20%"  stop-color="#aaa"/>
      <stop offset="50%"  stop-color="#777"/>
      <stop offset="80%"  stop-color="#666"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <!-- Dark front panel -->
    <linearGradient id="frontPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <!-- Top face -->
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <!-- Urn body -->
    <linearGradient id="urnBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#777"/>
      <stop offset="30%"  stop-color="#999"/>
      <stop offset="60%"  stop-color="#666"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <!-- Coffee in urn -->
    <linearGradient id="coffeeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(50,30,15,0.6)"/>
      <stop offset="100%" stop-color="rgba(20,10,5,0.85)"/>
    </linearGradient>
    <!-- Chrome trim -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ccc"/>
      <stop offset="30%"  stop-color="#eee"/>
      <stop offset="50%"  stop-color="#aaa"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <!-- Sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
      <stop offset="40%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="48%"  stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="52%"  stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="60%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="drop" x="-6%" y="-4%" width="112%" height="114%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-8%" y="-4%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="320" cy="450" rx="210" ry="15" fill="rgba(0,0,0,0.08)"/>

  <!-- Feet -->
  <rect x="152" y="415" width="18" height="8" rx="3" fill="#444"/>
  <rect x="470" y="415" width="18" height="8" rx="3" fill="#444"/>

  <!-- Main body -->
  <rect x="140" y="100" width="360" height="320" rx="16" fill="url(#steelBody)" filter="url(#drop)"/>

  <!-- Top face -->
  <rect x="148" y="92" width="344" height="22" rx="6" fill="url(#topFace)"/>

  <!-- Front dark panel -->
  <rect x="155" y="118" width="330" height="190" rx="8" fill="url(#frontPanel)"/>

  <!-- Sheen on body -->
  <rect x="150" y="105" width="340" height="305" rx="12" fill="url(#sheen)" pointer-events="none"/>

  <!-- Chrome trim: top -->
  <rect x="148" y="110" width="344" height="3" rx="1.5" fill="url(#chrome)" opacity="0.6"/>

  <!-- Chrome trim: bottom -->
  <rect x="148" y="390" width="344" height="3" rx="1.5" fill="url(#chrome)" opacity="0.5"/>

  <!-- Water level sight glass (left side) -->
  <rect x="168" y="135" width="16" height="130" rx="3" fill="#1a1a1a"/>
  <rect x="171" y="145" width="10" height="100" rx="1.5" fill="url(#coffeeFill)"/>
  <!-- Sight glass marks -->
  <line x1="169" y1="175" x2="177" y2="175" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <line x1="169" y1="215" x2="177" y2="215" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>

  <!-- Filter basket area (top center) -->
  <rect x="200" y="128" width="220" height="50" rx="6" fill="#1a1a1e"/>
  <rect x="210" y="134" width="200" height="38" rx="3" fill="#252528"/>
  <!-- Shower head -->
  <rect x="215" y="128" width="190" height="5" rx="2" fill="#444"/>

  <!-- Drip area -->
  <rect x="280" y="178" width="60" height="12" rx="3" fill="#1a1a1e"/>
  <circle cx="293" cy="184" r="1.3" fill="#444"/>
  <circle cx="305" cy="184" r="1.3" fill="#444"/>
  <circle cx="317" cy="184" r="1.3" fill="#444"/>
  <circle cx="329" cy="184" r="1.3" fill="#444"/>

  <!-- Coffee drip animation -->
  <g>
    <ellipse cx="293" cy="192" rx="1.8" ry="3" fill="rgba(80,50,25,0.8)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="192;222" dur="1.1s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="310" cy="192" rx="1.8" ry="3" fill="rgba(80,50,25,0.8)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="1.2s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="192;222" dur="1.2s" begin="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="327" cy="192" rx="1.8" ry="3" fill="rgba(80,50,25,0.8)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="1.15s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="192;222" dur="1.15s" begin="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Splash -->
    <ellipse cx="310" cy="222" rx="7" ry="1.3" fill="rgba(80,50,25,0.25)" opacity="0">
      <animate attributeName="opacity" values="0;0.3;0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="310" cy="222" rx="7" ry="1.3" fill="rgba(80,50,25,0.25)" opacity="0">
      <animate attributeName="opacity" values="0;0.3;0" dur="1.2s" begin="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="310" cy="222" rx="7" ry="1.3" fill="rgba(80,50,25,0.25)" opacity="0">
      <animate attributeName="opacity" values="0;0.3;0" dur="1.15s" begin="0.7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Dual warming plates -->
  <!-- Left plate -->
  <rect x="185" y="365" width="90" height="6" rx="2" fill="#333"/>
  <rect x="190" y="360" width="80" height="5" rx="2" fill="#444" opacity="0.5"/>
  <!-- Right plate -->
  <rect x="365" y="365" width="90" height="6" rx="2" fill="#333"/>
  <rect x="370" y="360" width="80" height="5" rx="2" fill="#444" opacity="0.5"/>

  <!-- Large commercial urn (left warming plate) -->
  <g>
    <path d="M205 365 L210 270 Q215 250 235 246 L245 246 Q265 250 270 270 L275 365 Z" fill="url(#urnBody)"/>
    <!-- Coffee in urn -->
    <path d="M212 310 Q240 306 268 310 L273 365 L207 365 Z" fill="url(#coffeeFill)"/>
    <!-- Urn highlight -->
    <path d="M218 365 L218 270 Q220 255 235 252 L240 252 L240 365 Z" fill="rgba(255,255,255,0.12)"/>
    <!-- Urn lid -->
    <rect x="225" y="238" width="30" height="10" rx="3" fill="#555"/>
    <!-- Lid handle -->
    <rect x="232" y="234" width="16" height="6" rx="3" fill="#666"/>
    <!-- Urn spout -->
    <path d="M270 300 Q282 295 285 290" fill="none" stroke="#666" stroke-width="4" stroke-linecap="round"/>
    <!-- Urn handle -->
    <path d="M207 290 Q190 290 190 325 Q190 360 205 360" fill="none" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <path d="M209 292 Q194 292 194 325 Q194 356 209 358" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Secondary thermal carafe (right warming plate) -->
  <g>
    <path d="M390 365 L394 285 Q396 270 410 268 L420 268 Q434 270 436 285 L440 365 Z" fill="url(#urnBody)"/>
    <path d="M395 310 Q415 306 435 310 L438 365 L392 365 Z" fill="url(#coffeeFill)"/>
    <path d="M398 365 L398 285 Q399 274 410 272 L414 272 L414 365 Z" fill="rgba(255,255,255,0.1)"/>
    <rect x="404" y="260" width="22" height="10" rx="3" fill="#555"/>
    <rect x="410" y="256" width="10" height="5" rx="2.5" fill="#666"/>
    <path d="M436 300 Q445 297 446 295" fill="none" stroke="#666" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M440 290 Q452 290 452 325 Q452 360 440 360" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Control panel -->
  <rect x="200" y="315" width="240" height="42" rx="6" fill="rgba(0,0,0,0.15)"/>

  <!-- Brew button left -->
  <rect x="220" y="326" width="40" height="20" rx="4" fill="#2a5a3a"/>
  <text x="240" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7ec88a">BREW</text>

  <!-- Brew button right -->
  <rect x="280" y="326" width="40" height="20" rx="4" fill="#2a5a3a"/>
  <text x="300" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7ec88a">BREW</text>

  <!-- Hot water tap indicator -->
  <rect x="350" y="326" width="60" height="20" rx="4" fill="#111"/>
  <text x="380" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#888">HOT WATER</text>

  <!-- Power LED -->
  <circle cx="210" cy="348" r="3" fill="#3cb878">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="348" r="6" fill="#3cb878" opacity="0.08">
    <animate attributeName="opacity" values="0.02;0.14;0.02" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ready LED right -->
  <circle cx="425" cy="348" r="3" fill="#3cb878">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Steam from left urn -->
  <g opacity="0.3">
    <path d="M220 240 Q222 225 218 210" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.45;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-2 -14" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M240 238 Q242 220 238 205" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2 -16" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M258 240 Q260 223 256 208" fill="none" stroke="#aaa" stroke-width="1.8" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="3 -12" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Steam from right carafe -->
  <g opacity="0.25">
    <path d="M415 256 Q416 242 413 228" fill="none" stroke="#aaa" stroke-width="1.8" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-2 -12" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M423 254 Q424 240 420 226" fill="none" stroke="#aaa" stroke-width="1.6" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.45;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2 -14" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Brand -->
  <text x="320" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#888">COMMERCIAL</text>
</svg>
