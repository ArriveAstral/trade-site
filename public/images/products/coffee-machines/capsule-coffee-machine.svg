<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a3e"/><stop offset="30%" stop-color="#2d2d32"/><stop offset="60%" stop-color="#252528"/><stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <linearGradient id="steelFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#999"/><stop offset="30%" stop-color="#bbb"/><stop offset="60%" stop-color="#888"/><stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/><stop offset="30%" stop-color="#eee"/><stop offset="50%" stop-color="#aaa"/><stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="waterTank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(135,206,235,0.25)"/><stop offset="100%" stop-color="rgba(90,170,200,0.35)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/><stop offset="40%" stop-color="rgba(255,255,255,0)"/><stop offset="48%" stop-color="rgba(255,255,255,0.12)"/><stop offset="52%" stop-color="rgba(255,255,255,0.12)"/><stop offset="60%" stop-color="rgba(255,255,255,0)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="drop" x="-6%" y="-2%" width="112%" height="114%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="soft" x="-8%" y="-4%" width="116%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>

  <ellipse cx="320" cy="450" rx="160" ry="12" fill="rgba(0,0,0,0.07)"/>

  <!-- Drip tray base -->
  <rect x="260" y="405" width="120" height="8" rx="3" fill="#333"/>

  <!-- Cup on tray -->
  <path d="M295 405 L297 370 Q300 362 310 360 L330 360 Q340 362 343 370 L345 405 Z" fill="rgba(255,255,255,0.9)"/>
  <ellipse cx="320" cy="360" rx="20" ry="4" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <!-- Coffee in cup -->
  <path d="M298 400 Q320 396 342 400 L343 405 L297 405 Z" fill="rgba(50,30,15,0.7)"/>
  <!-- Cup handle -->
  <path d="M345 375 Q355 375 355 390 Q355 400 345 400" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4" stroke-linecap="round"/>

  <!-- Main body -->
  <rect x="230" y="140" width="180" height="275" rx="18" fill="url(#bodyGrad)" filter="url(#drop)"/>

  <!-- Front steel panel -->
  <rect x="242" y="220" width="156" height="80" rx="8" fill="url(#steelFront)"/>

  <!-- Sheen -->
  <rect x="235" y="145" width="170" height="265" rx="14" fill="url(#sheen)" pointer-events="none"/>

  <!-- Chrome trim -->
  <rect x="238" y="210" width="164" height="3" rx="1.5" fill="url(#chrome)" opacity="0.5"/>

  <!-- Capsule slot (top) -->
  <rect x="255" y="130" width="130" height="25" rx="6" fill="#1a1a1e"/>
  <rect x="265" y="136" width="110" height="12" rx="3" fill="#111"/>
  <!-- Capsule being inserted -->
  <ellipse cx="320" cy="134" rx="18" ry="8" fill="url(#chrome)" opacity="0.7"/>

  <!-- Water tank (transparent, left side) -->
  <rect x="232" y="150" width="20" height="90" rx="4" fill="rgba(200,220,240,0.2)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <rect x="235" y="160" width="14" height="65" rx="2" fill="url(#waterTank)"/>

  <!-- Brew button -->
  <circle cx="290" cy="260" r="14" fill="#2a5a3a" filter="url(#soft)"/>
  <text x="290" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7ec88a">▶</text>

  <!-- Cup size button -->
  <circle cx="350" cy="260" r="10" fill="#444"/>
  <circle cx="350" cy="260" r="6" fill="#555"/>

  <!-- LED -->
  <circle cx="320" cy="320" r="4" fill="#3cb878"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="320" cy="320" r="7" fill="#3cb878" opacity="0.08"><animate attributeName="opacity" values="0.02;0.14;0.02" dur="2s" repeatCount="indefinite"/><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>

  <!-- Steam from cup -->
  <g opacity="0.3">
    <path d="M305 355 Q303 340 308 325" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="2.4s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="0 0" to="-2 -12" dur="2.4s" begin="0s" repeatCount="indefinite"/></path>
    <path d="M320 352 Q322 338 318 324" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.55;0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="0 0" to="1 -14" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></path>
    <path d="M335 355 Q337 340 333 325" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.45;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="0 0" to="3 -11" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></path>
  </g>

  <text x="320" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#777">CAPSULE</text>
</svg>