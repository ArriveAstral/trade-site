<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#777"/><stop offset="20%" stop-color="#999"/><stop offset="50%" stop-color="#666"/><stop offset="80%" stop-color="#555"/><stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <linearGradient id="darkFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e32"/><stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/><stop offset="30%" stop-color="#eee"/><stop offset="50%" stop-color="#aaa"/><stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/><stop offset="40%" stop-color="rgba(255,255,255,0)"/><stop offset="48%" stop-color="rgba(255,255,255,0.12)"/><stop offset="52%" stop-color="rgba(255,255,255,0.12)"/><stop offset="60%" stop-color="rgba(255,255,255,0)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="drop" x="-6%" y="-2%" width="112%" height="114%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="soft" x="-8%" y="-4%" width="116%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>

  <ellipse cx="320" cy="452" rx="195" ry="14" fill="rgba(0,0,0,0.08)"/>
  <rect x="140" y="420" width="16" height="8" rx="3" fill="#444"/>
  <rect x="484" y="420" width="16" height="8" rx="3" fill="#444"/>

  <!-- Drip tray -->
  <rect x="250" y="400" width="140" height="25" rx="4" fill="#2a2a2a"/>
  <rect x="258" y="396" width="124" height="6" rx="2" fill="#444"/>

  <!-- Cup -->
  <path d="M295 400 L297 370 Q300 362 310 360 L330 360 Q340 362 343 370 L345 400 Z" fill="#eee"/>
  <ellipse cx="320" cy="360" rx="20" ry="4" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <path d="M298 398 Q320 394 342 398 L343 400 L297 400 Z" fill="rgba(40,20,8,0.75)"/>
  <path d="M345 375 Q355 375 355 390 Q355 398 345 400" fill="none" stroke="#ddd" stroke-width="4" stroke-linecap="round"/>

  <!-- Main body -->
  <rect x="160" y="115" width="320" height="310" rx="18" fill="url(#bodyGrad)" filter="url(#drop)"/>

  <!-- Front dark panel -->
  <rect x="175" y="135" width="290" height="180" rx="10" fill="url(#darkFront)"/>

  <!-- Sheen -->
  <rect x="165" y="120" width="310" height="300" rx="14" fill="url(#sheen)" pointer-events="none"/>

  <!-- Chrome top trim -->
  <rect x="168" y="110" width="304" height="18" rx="5" fill="url(#chrome)" opacity="0.6"/>

  <!-- Pressure gauge -->
  <circle cx="280" cy="175" r="28" fill="#111" filter="url(#soft)"/>
  <circle cx="280" cy="175" r="22" fill="#1a1a1a"/>
  <circle cx="280" cy="175" r="18" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <!-- Gauge marks -->
  <line x1="280" y1="157" x2="280" y2="162" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="295" y1="165" x2="291" y2="169" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="265" y1="165" x2="269" y2="169" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Needle -->
  <line x1="280" y1="175" x2="272" y2="163" stroke="#e8655c" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="280" cy="175" r="3" fill="#444"/>

  <!-- Group head / portafilter -->
  <rect x="310" y="210" width="50" height="55" rx="4" fill="url(#chrome)" opacity="0.8"/>
  <rect x="315" y="218" width="40" height="4" rx="2" fill="#555"/>
  <!-- Portafilter handle -->
  <rect x="360" y="230" width="80" height="18" rx="3" fill="#333"/>
  <rect x="365" y="234" width="70" height="3" rx="1.5" fill="rgba(255,255,255,0.08)"/>
  <!-- Spout -->
  <rect x="330" y="258" width="4" height="10" rx="1" fill="#555"/>
  <rect x="336" y="258" width="4" height="10" rx="1" fill="#555"/>
  <!-- Coffee drip -->
  <ellipse cx="332" cy="272" rx="1.5" ry="3" fill="rgba(60,30,10,0.8)" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="1.3s" begin="0s" repeatCount="indefinite"/><animate attributeName="cy" values="272;350" dur="1.3s" begin="0s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="338" cy="272" rx="1.5" ry="3" fill="rgba(60,30,10,0.8)" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="1.1s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="cy" values="272;350" dur="1.1s" begin="0.45s" repeatCount="indefinite"/></ellipse>

  <!-- Steam wand -->
  <path d="M200 280 L195 340 Q193 355 198 365" fill="none" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="198" cy="367" r="4" fill="#888"/>
  <!-- Steam from wand -->
  <path d="M195 370 Q192 380 196 390" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.4;0" dur="1.8s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="0 0" to="-1 -8" dur="1.8s" begin="0s" repeatCount="indefinite"/></path>

  <!-- Steam knob -->
  <circle cx="195" cy="265" r="10" fill="#4a4a4a" filter="url(#soft)"/>
  <circle cx="195" cy="265" r="6" fill="#5a5a5a"/>

  <!-- Control buttons -->
  <rect x="230" y="255" width="35" height="35" rx="5" fill="#2a5a3a" filter="url(#soft)"/>
  <text x="247" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7ec88a">1</text>
  <rect x="275" y="255" width="35" height="35" rx="5" fill="#2a5a3a" filter="url(#soft)"/>
  <text x="292" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7ec88a">2</text>
  <rect x="380" y="255" width="24" height="24" rx="4" fill="#4a4a4a"/>
  <circle cx="400" cy="280" r="8" fill="#d9534f"/><circle cx="400" cy="280" r="5" fill="#e8655c"/>

  <!-- LED -->
  <circle cx="420" cy="268" r="3.5" fill="#3cb878"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>

  <!-- Steam from cup -->
  <g opacity="0.3">
    <path d="M310 355 Q308 340 312 328" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="0 0" to="-2 -10" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></path>
    <path d="M322 352 Q324 338 320 326" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.55;0" dur="2.6s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="0 0" to="1 -12" dur="2.6s" begin="0s" repeatCount="indefinite"/></path>
  </g>

  <text x="320" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#888">ESPRESSO</text>
</svg>