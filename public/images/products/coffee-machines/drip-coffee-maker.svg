<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <!-- Machine body: dark metallic -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3a3a3e"/>
      <stop offset="30%"  stop-color="#2d2d32"/>
      <stop offset="60%"  stop-color="#252528"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <!-- Top face -->
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#404044"/>
      <stop offset="100%" stop-color="#2a2a2e"/>
    </linearGradient>
    <!-- Water window -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#87ceeb"/>
      <stop offset="40%"  stop-color="#5badd0"/>
      <stop offset="100%" stop-color="#3a8ab5"/>
    </linearGradient>
    <!-- Glass carafe -->
    <linearGradient id="carafeGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(60,35,15,0.5)"/>
      <stop offset="20%"  stop-color="rgba(45,25,10,0.55)"/>
      <stop offset="50%"  stop-color="rgba(35,18,8,0.65)"/>
      <stop offset="80%"  stop-color="rgba(45,25,10,0.55)"/>
      <stop offset="100%" stop-color="rgba(55,32,14,0.5)"/>
    </linearGradient>
    <!-- Chrome/accent -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#999"/>
      <stop offset="30%"  stop-color="#ccc"/>
      <stop offset="50%"  stop-color="#888"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <!-- Stainless steel side -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#555"/>
      <stop offset="30%"  stop-color="#777"/>
      <stop offset="60%"  stop-color="#666"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <!-- Sheen sweep -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
      <stop offset="40%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="48%"  stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="52%"  stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="60%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="drop" x="-8%" y="-4%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-10%" y="-6%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="320" cy="448" rx="195" ry="14" fill="rgba(0,0,0,0.08)"/>

  <!-- Warming plate -->
  <rect x="265" y="396" width="110" height="7" rx="2" fill="#333"/>

  <!-- Glass carafe -->
  <g>
    <!-- Carafe body -->
    <path d="M278 396 L278 275 Q278 255 300 250 L340 250 Q362 255 362 275 L362 396 Z" fill="url(#carafeGlass)"/>
    <!-- Carafe glass highlight -->
    <path d="M284 396 L284 275 Q284 258 300 254 L308 254 L308 396 Z" fill="rgba(255,255,255,0.12)"/>
    <!-- Coffee fill -->
    <path d="M282 360 Q320 356 358 360 L360 396 L280 396 Z" fill="rgba(20,10,5,0.7)"/>
    <!-- Coffee surface -->
    <ellipse cx="320" cy="358" rx="38" ry="3" fill="rgba(15,8,4,0.5)"/>
    <!-- Carafe handle -->
    <path d="M362 290 Q380 290 380 325 Q380 365 362 375" fill="none" stroke="#555" stroke-width="8" stroke-linecap="round"/>
    <path d="M364 292 Q378 292 378 325 Q378 362 364 374" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Carafe rim ring -->
    <ellipse cx="320" cy="250" rx="42" ry="5" fill="none" stroke="#777" stroke-width="2"/>
    <!-- Carafe lid -->
    <ellipse cx="320" cy="250" rx="36" ry="4" fill="#444"/>
    <!-- Lid knob -->
    <ellipse cx="320" cy="248" rx="8" ry="2.5" fill="#555"/>
  </g>

  <!-- Main machine body -->
  <rect x="220" y="100" width="200" height="310" rx="18" fill="url(#bodyGrad)" filter="url(#drop)"/>

  <!-- Chrome base accent -->
  <rect x="226" y="385" width="188" height="4" rx="2" fill="url(#chrome)" opacity="0.5"/>

  <!-- Sheen sweep -->
  <rect x="225" y="105" width="190" height="300" rx="14" fill="url(#sheen)" pointer-events="none"/>

  <!-- Top face -->
  <rect x="230" y="95" width="180" height="20" rx="6" fill="url(#topGrad)"/>

  <!-- Water tank window (left side) -->
  <rect x="238" y="125" width="30" height="110" rx="4" fill="#111"/>
  <rect x="241" y="135" width="24" height="70" rx="2" fill="url(#waterGrad)"/>
  <!-- Water level marks -->
  <line x1="243" y1="155" x2="263" y2="155" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <text x="243" y="152" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.2)">8</text>
  <line x1="243" y1="175" x2="263" y2="175" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <text x="243" y="172" font-family="system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.2)">4</text>

  <!-- Stainless steel side panel (right) -->
  <rect x="360" y="120" width="40" height="230" rx="4" fill="url(#steel)"/>

  <!-- Filter basket housing -->
  <rect x="280" y="125" width="70" height="60" rx="6" fill="#1a1a1e"/>
  <!-- Filter basket visible inside -->
  <rect x="286" y="130" width="58" height="45" rx="4" fill="#222"/>
  <!-- Shower head -->
  <rect x="290" y="125" width="50" height="6" rx="2" fill="#444"/>

  <!-- Filter basket drip area -->
  <rect x="280" y="185" width="70" height="15" rx="3" fill="#1a1a1e"/>

  <!-- Drip holes -->
  <circle cx="293" cy="202" r="1.5" fill="#333"/>
  <circle cx="305" cy="202" r="1.5" fill="#333"/>
  <circle cx="317" cy="202" r="1.5" fill="#333"/>
  <circle cx="329" cy="202" r="1.5" fill="#333"/>
  <circle cx="341" cy="202" r="1.5" fill="#333"/>

  <!-- Coffee drip animation -->
  <g>
    <!-- Drip 1 -->
    <ellipse cx="305" cy="210" rx="2" ry="3.5" fill="rgba(80,50,25,0.8)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="1.15s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;242" dur="1.15s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Drip 2 -->
    <ellipse cx="320" cy="210" rx="2" ry="3.5" fill="rgba(80,50,25,0.8)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="1.25s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;242" dur="1.25s" begin="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Drip 3 -->
    <ellipse cx="335" cy="210" rx="2" ry="3.5" fill="rgba(80,50,25,0.8)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="1.2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;242" dur="1.2s" begin="0.7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Splash ripples -->
    <ellipse cx="320" cy="242" rx="8" ry="1.5" fill="rgba(80,50,25,0.3)" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0" dur="1.15s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="320" cy="242" rx="8" ry="1.5" fill="rgba(80,50,25,0.3)" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0" dur="1.25s" begin="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="320" cy="242" rx="8" ry="1.5" fill="rgba(80,50,25,0.3)" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0" dur="1.2s" begin="0.7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Control panel -->
  <rect x="238" y="275" width="100" height="80" rx="6" fill="rgba(0,0,0,0.2)"/>

  <!-- Power switch -->
  <rect x="250" y="288" width="30" height="16" rx="8" fill="#111"/>
  <circle cx="274" cy="296" r="6" fill="#888"/>

  <!-- Brew strength dial -->
  <circle cx="287" cy="328" r="13" fill="#111" filter="url(#soft)"/>
  <circle cx="287" cy="328" r="8" fill="#333"/>
  <line x1="287" y1="328" x2="287" y2="320" stroke="#aaa" stroke-width="1.6" stroke-linecap="round"/>

  <!-- LED indicator (breathing) -->
  <circle cx="252" cy="336" r="3.5" fill="#3cb878">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="252" cy="336" r="7" fill="#3cb878" opacity="0.08">
    <animate attributeName="opacity" values="0.02;0.14;0.02" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Steam from carafe -->
  <g opacity="0.35">
    <path d="M290 248 Q292 232 288 218" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.45;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-3 -14" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M320 246 Q322 228 318 214" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2 -16" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M348 248 Q350 230 346 216" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="2.7s" begin="1.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="4 -12" dur="2.7s" begin="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Brand -->
  <text x="320" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#777">DRIP COFFEE</text>
</svg>
