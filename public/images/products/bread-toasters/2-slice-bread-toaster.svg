<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <!-- Body gradient: warm matte cream -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#faf7f2"/>
      <stop offset="50%"  stop-color="#f2ede5"/>
      <stop offset="100%" stop-color="#e8e2d8"/>
    </linearGradient>

    <!-- Top face -->
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e2d8"/>
      <stop offset="100%" stop-color="#ddd6ca"/>
    </linearGradient>

    <!-- Sheen sweep -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
      <stop offset="45%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%"  stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Bread color -->
    <linearGradient id="breadFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2d48a"/>
      <stop offset="25%"  stop-color="#eac870"/>
      <stop offset="70%"  stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#c4952e"/>
    </linearGradient>

    <!-- Bread dome top -->
    <radialGradient id="breadDome" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#f7de9c"/>
      <stop offset="100%" stop-color="#e2b84a"/>
    </radialGradient>

    <!-- Slot darkness -->
    <radialGradient id="slotInner" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- Chrome accent -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e0ddd8"/>
      <stop offset="30%"  stop-color="#f0ede8"/>
      <stop offset="50%"  stop-color="#c8c4bc"/>
      <stop offset="100%" stop-color="#a8a49c"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="drop" x="-8%" y="-4%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-8%" y="-4%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="320" cy="430" rx="200" ry="16" fill="rgba(0,0,0,0.07)"/>

  <!-- Base / feet -->
  <rect x="130" y="395" width="16" height="8" rx="3" fill="#a09890"/>
  <rect x="494" y="395" width="16" height="8" rx="3" fill="#a09890"/>

  <!-- Main body -->
  <rect x="100" y="125" width="440" height="275" rx="32" fill="url(#bodyGrad)" filter="url(#drop)"/>

  <!-- Body bottom trim (chrome band) -->
  <rect x="110" y="370" width="420" height="5" rx="2" fill="url(#chrome)" opacity="0.6"/>

  <!-- Sheen overlay -->
  <rect x="105" y="130" width="430" height="265" rx="28" fill="url(#sheen)" pointer-events="none"/>

  <!-- Top face -->
  <rect x="115" y="115" width="410" height="28" rx="10" fill="url(#topGrad)"/>

  <!-- Slot 1 -->
  <rect x="165" y="88" width="72" height="58" rx="10" fill="url(#slotInner)"/>

  <!-- Slot 2 -->
  <rect x="403" y="88" width="72" height="58" rx="10" fill="url(#slotInner)"/>

  <!-- Bread slice 1 -->
  <g>
    <!-- Toast body -->
    <path d="M178 145 L178 116 Q178 72 201 68 Q224 72 224 116 L224 145 Z" fill="url(#breadFace)"/>
    <!-- Dome top highlight -->
    <path d="M185 110 Q201 76 217 110" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <!-- Crust line -->
    <path d="M177 116 Q201 70 225 116" fill="none" stroke="#b8802a" stroke-width="1.5" opacity="0.4"/>
    <!-- Texture dots -->
    <circle cx="195" cy="128" r="1.2" fill="#c49a3a" opacity="0.3"/>
    <circle cx="208" cy="135" r="1"   fill="#c49a3a" opacity="0.3"/>
    <circle cx="200" cy="140" r="1.4" fill="#c49a3a" opacity="0.25"/>
  </g>

  <!-- Bread slice 2 -->
  <g>
    <path d="M416 145 L416 116 Q416 72 439 68 Q462 72 462 116 L462 145 Z" fill="url(#breadFace)"/>
    <path d="M423 110 Q439 76 455 110" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <path d="M415 116 Q439 70 463 116" fill="none" stroke="#b8802a" stroke-width="1.5" opacity="0.4"/>
    <circle cx="433" cy="128" r="1.2" fill="#c49a3a" opacity="0.3"/>
    <circle cx="446" cy="135" r="1"   fill="#c49a3a" opacity="0.3"/>
    <circle cx="438" cy="140" r="1.4" fill="#c49a3a" opacity="0.25"/>
  </g>

  <!-- Toast lever slot -->
  <rect x="505" y="185" width="8" height="105" rx="4" fill="#555"/>
  <rect x="508" y="188" width="2" height="99" rx="1" fill="#333"/>

  <!-- Toast lever knob -->
  <rect x="495" y="178" width="28" height="22" rx="6" fill="url(#chrome)" filter="url(#soft)"/>
  <rect x="500" y="182" width="18" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Control area background -->
  <rect x="145" y="290" width="350" height="60" rx="12" fill="rgba(0,0,0,0.03)"/>

  <!-- Browning dial -->
  <circle cx="210" cy="320" r="18" fill="#444" filter="url(#soft)"/>
  <circle cx="210" cy="320" r="12" fill="#555"/>
  <circle cx="210" cy="320" r="6"  fill="#666"/>
  <line x1="210" y1="320" x2="210" y2="309" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>

  <!-- Cancel button -->
  <circle cx="275" cy="320" r="11" fill="#d3544d"/>
  <circle cx="275" cy="320" r="8"  fill="#e8655c"/>
  <circle cx="273" cy="318" r="3"  fill="rgba(255,255,255,0.25)"/>

  <!-- Bagel button -->
  <circle cx="325" cy="320" r="9" fill="#4a4a4a"/>
  <circle cx="325" cy="320" r="6" fill="#5a5a5a"/>

  <!-- Defrost button -->
  <circle cx="375" cy="320" r="9" fill="#4a4a4a"/>
  <circle cx="375" cy="320" r="6" fill="#5a5a5a"/>

  <!-- LED indicator (pulsing) -->
  <circle cx="430" cy="320" r="5" fill="#3cb878">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="320" r="9" fill="#3cb878" opacity="0.12">
    <animate attributeName="opacity" values="0.04;0.18;0.04" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="8;13;8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Steam wisps -->
  <g opacity="0.5">
    <!-- Wisp 1 -->
    <path d="M195 60 Q192 40 196 20 Q200 0 197 -15" fill="none" stroke="#bbb" stroke-width="2.5" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-4 -20" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    </path>

    <!-- Wisp 2 -->
    <path d="M201 58 Q204 35 200 15 Q196 -2 202 -18" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="3 -22" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </path>

    <!-- Wisp 3 -->
    <path d="M433 58 Q430 38 435 18 Q438 -2 434 -18" fill="none" stroke="#bbb" stroke-width="2.5" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-3 -18" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </path>

    <!-- Wisp 4 -->
    <path d="M441 55 Q445 35 440 15 Q437 -2 442 -16" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="5 -16" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Brand name -->
  <text x="320" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#c5bfb2">TOASTER</text>
</svg>
